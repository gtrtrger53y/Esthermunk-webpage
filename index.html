<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Mother's Day, Mommy 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:  #c9847a;
      --blush: #f2ddd9;
      --cream: #fdf6f0;
      --gold:  #c4a882;
      --deep:  #3b2a28;
      --text:  #5c3d38;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── FALLING PETALS ── */
    .petal {
      position: fixed;
      border-radius: 50% 50% 50% 0 / 60% 60% 40% 40%;
      opacity: 0;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 999;
    }
    @keyframes fall {
      0%   { transform: translateY(-80px) rotate(0deg) translateX(0); opacity: 0; }
      8%   { opacity: 0.6; }
      50%  { transform: translateY(50vh) rotate(180deg) translateX(30px); }
      92%  { opacity: 0.4; }
      100% { transform: translateY(105vh) rotate(360deg) translateX(-20px); opacity: 0; }
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 100px;
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, #f5cec7 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 90% 100%, #edddd0 0%, transparent 60%),
        var(--cream);
      overflow: hidden;
    }

    .hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(13px, 3.8vw, 17px);
      letter-spacing: 0.3em;
      color: var(--rose);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 1s 0.4s forwards;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(64px, 18vw, 140px);
      line-height: 0.92;
      color: var(--deep);
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 1.1s 0.7s forwards;
    }

    .hero-title em {
      display: block;
      font-style: italic;
      color: var(--rose);
    }

    .hero-divider {
      margin: 36px auto;
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0;
      animation: fadeUp 1s 1.1s forwards;
    }

    .hero-sub {
      font-size: clamp(14px, 3.5vw, 16px);
      letter-spacing: 0.15em;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1s 1.3s forwards;
    }

    .scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeUp 1s 2s forwards;
    }
    .scroll-hint span {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--rose);
      text-transform: uppercase;
    }
    .scroll-hint .arrow {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, var(--rose), transparent);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCRAPBOOK SECTION ── */
    .scrapbook {
      padding: 60px 16px 100px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .scrapbook-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(28px, 7vw, 44px);
      color: var(--deep);
      text-align: center;
      margin-bottom: 48px;
    }

    /* ── MASONRY GRID ── */
    .grid {
      columns: 2;
      column-gap: 12px;
    }
    @media (min-width: 560px)  { .grid { columns: 3; column-gap: 14px; } }
    @media (min-width: 860px)  { .grid { columns: 4; column-gap: 16px; } }

    .card {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      opacity: 0;
      transition: transform 0.45s ease, box-shadow 0.45s ease, opacity 0.5s ease;
      background: var(--blush);
      box-shadow: 0 2px 8px rgba(59,42,40,0.08);
    }
    .card.visible { opacity: 1; }

    /* subtle random tilts */
    .card:nth-child(4n+1) { transform: rotate(-1.2deg); }
    .card:nth-child(4n+2) { transform: rotate(0.7deg); }
    .card:nth-child(4n+3) { transform: rotate(-0.4deg); }
    .card:nth-child(4n+4) { transform: rotate(1deg); }

    .card:not(.visible):nth-child(4n+1) { transform: rotate(-1.2deg) translateY(18px); opacity:0; }
    .card:not(.visible):nth-child(4n+2) { transform: rotate(0.7deg) translateY(18px); opacity:0; }
    .card:not(.visible):nth-child(4n+3) { transform: rotate(-0.4deg) translateY(18px); opacity:0; }
    .card:not(.visible):nth-child(4n+4) { transform: rotate(1deg) translateY(18px); opacity:0; }

    @media (hover: hover) {
      .card:hover {
        transform: rotate(0deg) translateY(-5px) scale(1.02) !important;
        box-shadow: 0 18px 48px rgba(59,42,40,0.2);
        z-index: 2;
      }
    }
    .card:active { transform: scale(0.97) !important; }

    .card img {
      width: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    @media (hover: hover) {
      .card:hover img { transform: scale(1.05); }
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(28,16,14,0.93);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      touch-action: none;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lightbox img {
      max-width: 100%;
      max-height: 88svh;
      border-radius: 3px;
      object-fit: contain;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34,1.4,0.64,1), opacity 0.2s ease;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    }
    .lightbox.open img { transform: scale(1); }

    .lb-btn {
      position: absolute;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      color: #f2ddd9;
      border-radius: 50%;
      width: 46px; height: 46px;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.18); }
    #lb-close { top: 18px; right: 20px; font-size: 18px; }
    #lb-prev  { left: 12px; top: 50%; transform: translateY(-50%); }
    #lb-next  { right: 12px; top: 50%; transform: translateY(-50%); }

    /* ── LOADING / EMPTY ── */
    .loading, .empty {
      text-align: center;
      padding: 60px 24px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--gold);
      grid-column: 1 / -1;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 40px 24px 70px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(17px, 4.5vw, 24px);
      color: var(--rose);
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <p class="hero-eyebrow">with all my heart</p>
    <h1 class="hero-title">Happy<br>Mother's<br><em>Day</em></h1>
    <div class="hero-divider"></div>
    <p class="hero-sub">Mommy &nbsp;🌸</p>
    <div class="scroll-hint">
      <span>our memories</span>
      <div class="arrow"></div>
    </div>
  </section>

  <!-- SCRAPBOOK -->
  <section class="scrapbook">
    <h2 class="scrapbook-title">A little piece of us ♡</h2>
    <div class="grid" id="grid">
      <div class="loading">Loading memories…</div>
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lb-btn" id="lb-close">✕</button>
    <button class="lb-btn" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="Memory" />
    <button class="lb-btn" id="lb-next">›</button>
  </div>

  <!-- FOOTER -->
  <footer>I love you more than words can say ♡</footer>

  <script>
    /* ── PETALS ── */
    const PETAL_COLORS = ['#e8a9a2','#d4887f','#c4a882','#f2c4be','#dbb89a','#e8c5bb'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const s = 9 + Math.random() * 13;
      Object.assign(p.style, {
        width: s + 'px',
        height: (s * 1.45) + 'px',
        left: (Math.random() * 100) + 'vw',
        background: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
        animationDuration: (6 + Math.random() * 9) + 's',
        animationDelay: (Math.random() * 10) + 's',
        transform: `rotate(${Math.random()*360}deg)`
      });
      document.body.appendChild(p);
    }

    /* ── PHOTOS ── */
    let photos = [];
    let current = 0;

    async function loadPhotos() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('photos.json');
        if (!res.ok) throw new Error();
        const raw = await res.json();
        photos = (Array.isArray(raw) ? raw : [raw])
          .filter(f => /\.(jpg|jpeg|png|webp|gif)$/i.test(f));

        if (!photos.length) {
          grid.innerHTML = '<div class="empty">Drop photos in the photos folder and run generate.bat 🌸</div>';
          return;
        }

        grid.innerHTML = '';
        photos.forEach((name, i) => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = 'photos/' + name;
          img.alt = 'Memory ' + (i + 1);
          img.loading = 'lazy';
          card.appendChild(img);
          card.addEventListener('click', () => open(i));
          grid.appendChild(card);
        });

        const io = new IntersectionObserver((entries) => {
          entries.forEach((e, idx) => {
            if (e.isIntersecting) {
              setTimeout(() => e.target.classList.add('visible'), idx * 55);
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.08 });
        document.querySelectorAll('.card').forEach(c => io.observe(c));

      } catch {
        grid.innerHTML = '<div class="empty">Add photos to the photos folder and run generate.bat 🌸</div>';
      }
    }

    /* ── LIGHTBOX ── */
    const lb    = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');

    function open(i) {
      current = i;
      lbImg.src = 'photos/' + photos[current];
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => lbImg.src = '', 300);
    }

    function prev() {
      current = (current - 1 + photos.length) % photos.length;
      lbImg.style.opacity = '0';
      setTimeout(() => { lbImg.src = 'photos/' + photos[current]; lbImg.style.opacity = '1'; }, 140);
    }

    function next() {
      current = (current + 1) % photos.length;
      lbImg.style.opacity = '0';
      setTimeout(() => { lbImg.src = 'photos/' + photos[current]; lbImg.style.opacity = '1'; }, 140);
    }

    document.getElementById('lb-close').onclick = close;
    document.getElementById('lb-prev').onclick  = prev;
    document.getElementById('lb-next').onclick  = next;
    lb.addEventListener('click', e => { if (e.target === lb) close(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });

    /* swipe on lightbox */
    let tx = 0;
    lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
    lb.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 45) dx < 0 ? next() : prev();
    });

    loadPhotos();
  </script>
</body>
</html>
